<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelime</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand" data-act="home" title="Ana sayfa">
        <img class="logo" src="logo.png" alt=""><span>Kelime</span>
      </div>
      <div class="side-actions">
        <button class="primary" data-act="new-deck" title="Yeni deste (Ctrl+N)">+ Yeni deste</button>
        <button data-act="import" title="JSON içe aktar (Ctrl+O)">İçe aktar</button>
      </div>
      <div class="side-label">Desteler</div>
      <nav id="deck-list"></nav>
      <div class="side-foot">
        <button class="ghost" data-act="theme" id="btn-theme" title="Tema"></button>
        <button class="ghost" data-act="toggle-autospeak" id="btn-autospeak" title="Kart açılınca kelimeyi otomatik seslendir"></button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="drop-overlay"><div>JSON dosyasını buraya bırak</div></div>
  <script src="app.js"></script>
</body>
</html>
