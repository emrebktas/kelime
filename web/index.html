<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://ytrrmjhhbmarwniaqngz.supabase.co wss://ytrrmjhhbmarwniaqngz.supabase.co http://127.0.0.1:54321; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Kelime</title>
  <meta name="description" content="Anki tarzı kelime kartları: IELTS, Almanca ve diğer diller için aralıklı tekrar.">
  <meta name="theme-color" content="#4f5bd5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="icon-btn" data-act="menu" aria-label="Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span id="topbar-title">Kelime</span>
      <span id="topbar-sync"></span>
    </header>
    <aside id="sidebar">
      <div class="brand" data-act="home" title="Ana sayfa">
        <img class="logo" src="icons/logo.png" alt=""><span>Kelime</span>
      </div>
      <div class="side-actions">
        <button class="primary wide" data-act="new-deck" title="Yeni deste (Ctrl+N)">+ Yeni deste</button>
        <button data-act="import" title="JSON içe aktar (Ctrl+O)">İçe aktar</button>
        <button data-act="join" id="btn-join" title="Paylaşım koduyla bir desteye katıl">Kodla katıl</button>
      </div>
      <div class="side-label">Desteler</div>
      <nav id="deck-list"></nav>
      <div class="side-foot">
        <button class="account" data-act="account" id="account-btn"></button>
        <div class="side-tools">
          <button class="ghost" data-act="theme" id="btn-theme" title="Tema"></button>
          <button class="ghost" data-act="speech-settings" id="btn-autospeak" title="Seslendirme ayarları"></button>
        </div>
      </div>
    </aside>
    <div id="scrim" data-act="menu-close"></div>
    <main id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="drop-overlay"><div>JSON dosyasını buraya bırak</div></div>
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
