<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://ytrrmjhhbmarwniaqngz.supabase.co wss://ytrrmjhhbmarwniaqngz.supabase.co https://api.github.com https://api.languagetool.org http://127.0.0.1:54321; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Kelime</title>
  <meta name="description" content="Anki tarzı kelime kartları: IELTS, Almanca ve diğer diller için aralıklı tekrar.">
  <meta name="theme-color" content="#D8CFBE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="ds.css">
  <link rel="stylesheet" href="fsp-train.css">
  <link rel="stylesheet" href="fsp-learn.css">
  <link rel="stylesheet" href="fsp-exam.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="icon-btn" data-act="menu" aria-label="Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span id="topbar-title">Kelime</span>
      <button id="chat-chip" class="icon-btn chat-chip hidden" data-act="chat" title="Mesajlar" aria-label="Mesajlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="chat-count count-badge hidden"></span>
      </button>
      <button id="timer-chip" class="timer-chip" data-act="timer" title="Çalışma sayacı"></button>
      <button id="btn-settings" class="icon-btn" data-act="settings" title="Ayarlar" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <span id="topbar-sync"></span>
    </header>
    <div id="rail-hot" aria-hidden="true"></div>
    <aside id="sidebar">
      <div class="brand" data-act="home" title="Ana sayfa">
        <img class="logo" src="icons/logo.png" alt=""><span>Kelime</span>
      </div>
      <div class="side-actions">
        <button class="primary wide" data-act="new-deck" title="Yeni deste (Ctrl+N)">+ Yeni deste</button>
        <button data-act="import" title="JSON içe aktar (Ctrl+O)">İçe aktar</button>
        <button data-act="join" id="btn-join" title="Paylaşım koduyla bir desteye katıl">Kodla katıl</button>
      </div>
      <button id="nav-home" class="nav-btn" data-act="home" title="Ana sayfa"><i class="nav-ic" data-ic="home"></i><span>Ana sayfa</span></button>
      <button id="nav-decks" class="nav-btn" data-act="decks" title="Desteler"><i class="nav-ic" data-ic="layers"></i><span>Desteler</span></button>
      <button id="nav-essays" class="nav-btn" data-act="essays" title="IELTS Writing yazıların"><i class="nav-ic" data-ic="pen"></i><span>Yazılarım</span><small>IELTS Writing</small></button>
      <button id="nav-reading" class="nav-btn" data-act="readings" title="IELTS Reading testlerin"><i class="nav-ic" data-ic="book"></i><span>Okuma</span><small>IELTS Reading</small></button>
      <button id="nav-fsp" class="nav-btn" data-act="fsp" title="Fachsprachprüfung Zahnmedizin"><i class="nav-ic" data-ic="tooth"></i><span>FSP</span><small>Zahnmedizin</small></button>
      <button id="nav-chat" class="nav-btn hidden" data-act="chat" title="Ortak destedeki kişilerle mesajlaş">
        <i class="nav-ic" data-ic="chat"></i><span>Mesajlar</span><span class="chat-count count-badge hidden"></span>
      </button>
      <div class="side-label">Desteler</div>
      <nav id="deck-list"></nav>
      <button id="timer-widget" class="timer-widget" data-act="timer" title="Çalışma sayacı ve geçmişi"></button>
      <div class="side-foot">
        <button class="account" data-act="account" id="account-btn"></button>
        <div class="side-tools">
          <button class="ghost" data-act="theme" id="btn-theme" title="Tema"></button>
          <button class="ghost" data-act="speech-settings" id="btn-autospeak" title="Seslendirme ayarları"></button>
          <button class="ghost" data-act="rail-toggle" id="btn-rail" title="Çubuğu gizle"></button>
        </div>
      </div>
    </aside>
    <div id="scrim" data-act="menu-close"></div>
    <main id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="drop-overlay"><div>JSON dosyasını buraya bırak</div></div>
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
