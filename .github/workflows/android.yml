# Android APK'yı derler ve GitHub Releases'e koyar.
# Son sürüm her zaman: https://github.com/emrebktas/kelime/releases/latest/download/kelime.apk
#
# İmza: depo ayarlarında ANDROID_KEYSTORE_BASE64 ve ANDROID_KEYSTORE_PASSWORD gizli değişkenleri
# varsa kalıcı anahtarla imzalanır (güncellemeler eski sürümün üzerine kurulur).
# Yoksa geçici bir test anahtarıyla imzalanır.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-build/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sürüm notları için önceki sürüm etiketi ve commit geçmişi gerekli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund

      - name: Android projesi
        run: npx cap add android

      - name: Simgeler ve açılış ekranı
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#EEE6D8' --iconBackgroundColorDark '#EEE6D8'
          --splashBackgroundColor '#EEE6D8' --splashBackgroundColorDark '#2E2A27'

      - name: Sürüm ve imza ayarları
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 android-build/patch.py gradle ${{ github.run_number }}
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kelime.p12"
            echo "KELIME_KEYSTORE=$RUNNER_TEMP/kelime.p12" >> "$GITHUB_ENV"
            echo "BUILD=release" >> "$GITHUB_ENV"
          else
            echo "::warning::İmza anahtarı tanımlı değil; test anahtarıyla imzalanacak."
            echo "BUILD=debug" >> "$GITHUB_ENV"
          fi

      - name: Web dosyalarını kopyala
        run: |
          npx cap sync android
          python3 android-build/patch.py csp

      - name: APK derle
        working-directory: android
        env:
          KELIME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../kelime.apk
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../kelime.apk
          fi
          rm -f "$RUNNER_TEMP/kelime.p12"

      # Uygulamadaki "Yeni sürüm hazır" bildirimi "- " ile başlayan satırları gösterir
      - name: Sürüm notları
        run: |
          PREV=$(git tag --list 'android-v*' --sort=-v:refname | head -1)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log "$PREV"..HEAD --no-merges --format='- %s' -- web assets package.json capacitor.config.json android-build | head -15)
          else
            CHANGES=$(git log -1 --format='- %s')
          fi
          [ -z "$CHANGES" ] && CHANGES="- Küçük iyileştirmeler"
          if [ "$BUILD" = "release" ]; then SIGN="kalıcı anahtar"; else SIGN="geçici test anahtarı"; fi
          {
            echo "### Yenilikler"
            echo "$CHANGES"
            echo
            echo "**Telefona kurulum:** Telefonda bu sayfayı aç, aşağıdaki \`kelime.apk\` dosyasına dokun ve indir."
            echo "İndirme bitince dosyayı aç; Android \"bilinmeyen kaynaklardan yükleme\" izni isterse bu seferlik izin ver."
            echo
            echo "Güncellemek için yeni sürümün APK'sını aynı şekilde kurman yeterli, verilerin korunur."
            echo
            echo "İmza: $SIGN"
          } > release-notes.md
          cat release-notes.md

      - name: Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Kelime Android 1.0.${{ github.run_number }}
          make_latest: true
          files: kelime.apk
          body_path: release-notes.md
